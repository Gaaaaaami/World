<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- 终端窗口外框 -->
  <rect x="2" y="3.5" width="16" height="13" rx="2" ry="2"
        fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- 标题栏分隔线 -->
  <line x1="2" y1="7" x2="18" y2="7"
        stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <!-- 窗口圆点 -->
  <circle cx="4.5" cy="5.25" r="0.6" fill="#FFFFFF"/>
  <circle cx="6.5" cy="5.25" r="0.6" fill="#FFFFFF"/>
  <!-- 命令提示符 > -->
  <path d="M5 10 L8 12.5 L5 15"
        fill="none" stroke="#FFFFFF" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 光标 _ -->
  <line x1="10" y1="15" x2="15" y2="15"
        stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>